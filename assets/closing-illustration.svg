<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa một cánh cửa hé mở với ánh sáng ấm tràn ra, tượng trưng cho một cuộc trò chuyện chưa khép lại">
  <defs>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFEDE5"/>
      <stop offset="100%" stop-color="#F1EFE8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A4046"/>
      <stop offset="100%" stop-color="#24282C"/>
    </linearGradient>
    <linearGradient id="lightBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7E2D2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E7E2D2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9D4C6"/>
      <stop offset="100%" stop-color="#D9D4C6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="560" fill="url(#skyGlow)"/>

  <!-- ground -->
  <ellipse cx="320" cy="520" rx="300" ry="34" fill="#E7E2D5" opacity="0.6"/>

  <!-- soft light path leading out from the door -->
  <path d="M320 460 L120 540 L520 540 Z" fill="url(#lightBeam)"/>

  <!-- door frame -->
  <rect x="215" y="120" width="210" height="360" rx="14" fill="#E3DFD2"/>
  <rect x="230" y="134" width="180" height="332" rx="10" fill="#F1EFE8"/>

  <!-- door, ajar, revealing warm light -->
  <path d="M245 150 h120 v300 q-70 12 -120 -20 z" fill="url(#lightBeam)"/>
  <g transform="translate(245,150)">
    <path d="M0 0 h95 v300 l-95 -22 z" fill="url(#doorGrad)"/>
    <circle cx="80" cy="150" r="6" fill="#7C88A8"/>
  </g>

  <!-- small figure walking toward the light, suggesting an open, ongoing conversation -->
  <g transform="translate(300,392)">
    <circle cx="0" cy="-46" r="14" fill="#24282C"/>
    <path d="M-16 -30 q16 -14 32 0 l-6 62 q-10 8 -20 0z" fill="#2F6F68"/>
    <line x1="-10" y1="30" x2="-14" y2="66" stroke="#24282C" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="30" x2="12" y2="66" stroke="#24282C" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- floating speech dots: conversation continuing -->
  <g fill="#B0812E" opacity="0.85">
    <circle cx="470" cy="210" r="6"/>
    <circle cx="492" cy="196" r="4.5"/>
    <circle cx="510" cy="216" r="3.5"/>
  </g>
  <g fill="#3E8079" opacity="0.8">
    <circle cx="150" cy="240" r="5"/>
    <circle cx="130" cy="256" r="3.5"/>
  </g>

  <!-- gentle rays -->
  <g stroke="#7C88A8" stroke-width="2" opacity="0.5" stroke-linecap="round">
    <line x1="320" y1="90" x2="320" y2="60"/>
    <line x1="270" y1="100" x2="248" y2="76"/>
    <line x1="370" y1="100" x2="392" y2="76"/>
  </g>
</svg>
