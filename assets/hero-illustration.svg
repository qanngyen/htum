<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa chân dung mềm mại được ghép từ nhiều lớp hình khối, tượng trưng cho nhiều trải nghiệm hội tụ thành một con người">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#EFEDE5"/>
      <stop offset="100%" stop-color="#EFEDE5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3E8079"/>
      <stop offset="100%" stop-color="#2F6F68"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C99A5A"/>
      <stop offset="100%" stop-color="#B0812E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C88A8"/>
      <stop offset="100%" stop-color="#4F5A76"/>
    </linearGradient>
    <linearGradient id="plumGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4046"/>
      <stop offset="100%" stop-color="#24282C"/>
    </linearGradient>
  </defs>

  <circle cx="320" cy="300" r="270" fill="url(#glow)"/>

  <!-- soft orbit rings -->
  <circle cx="320" cy="300" r="235" fill="none" stroke="#D9D4C6" stroke-width="1.5" stroke-dasharray="2 10" opacity="0.8"/>

  <!-- back layered blobs: "lớp trải nghiệm" -->
  <path d="M180 260 Q150 180 240 150 Q330 122 380 190 Q430 258 370 310 Q310 362 230 340 Q160 320 180 260 Z" fill="url(#sageGrad)" opacity="0.55"/>
  <path d="M420 220 Q480 190 500 260 Q520 330 460 360 Q400 390 360 340 Q328 296 370 260 Q400 234 420 220 Z" fill="url(#coralGrad)" opacity="0.55"/>
  <path d="M240 380 Q210 440 270 470 Q330 500 380 460 Q425 425 390 380 Q350 328 300 350 Q260 366 240 380 Z" fill="url(#goldGrad)" opacity="0.6"/>

  <!-- central silhouette bust, built from soft rounded shapes -->
  <g>
    <path d="M320 150c-46 0-83 38-83 90 0 36 18 66 45 82-58 20-101 62-112 118-4 20 10 40 31 40h238c21 0 35-20 31-40-11-56-54-98-112-118 27-16 45-46 45-82 0-52-37-90-83-90z" fill="url(#plumGrad)"/>
    <path d="M320 150c-46 0-83 38-83 90 0 36 18 66 45 82-58 20-101 62-112 118-4 20 10 40 31 40h238c21 0 35-20 31-40-11-56-54-98-112-118 27-16 45-46 45-82 0-52-37-90-83-90z" fill="#24282C" opacity="0.06"/>
  </g>

  <!-- connective thread linking small icon nodes: "hệ thống hóa" trait -->
  <g stroke="#8B8F79" stroke-width="2.5" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M150 470 C 190 430, 230 500, 270 460 S 350 430, 400 470 S 470 500, 500 450"/>
  </g>

  <!-- node: research / lens -->
  <g transform="translate(140,455)">
    <circle r="26" fill="#FCFCF9" stroke="#8B8F79" stroke-width="2"/>
    <circle cx="-3" cy="-3" r="8" fill="none" stroke="#2F6F68" stroke-width="3"/>
    <line x1="4" y1="4" x2="11" y2="11" stroke="#2F6F68" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- node: books / learning -->
  <g transform="translate(272,485)">
    <circle r="26" fill="#FCFCF9" stroke="#8B8F79" stroke-width="2"/>
    <path d="M-11 -8 h9 a3 3 0 0 1 3 3 v11 a3 3 0 0 0 -3 -3 h-9z" fill="#B0812E"/>
    <path d="M11 -8 h-9 a3 3 0 0 0 -3 3 v11 a3 3 0 0 1 3 -3 h9z" fill="#C99A5A"/>
  </g>

  <!-- node: community / people -->
  <g transform="translate(403,463)">
    <circle r="26" fill="#FCFCF9" stroke="#8B8F79" stroke-width="2"/>
    <circle cx="-6" cy="-4" r="6" fill="#4F5A76"/>
    <circle cx="7" cy="-4" r="6" fill="#7C88A8"/>
    <path d="M-14 10 q8 -10 14 0" fill="none" stroke="#4F5A76" stroke-width="3" stroke-linecap="round"/>
    <path d="M0 10 q8 -10 14 0" fill="none" stroke="#7C88A8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- node: technology / system -->
  <g transform="translate(505,442)">
    <circle r="26" fill="#FCFCF9" stroke="#8B8F79" stroke-width="2"/>
    <rect x="-10" y="-10" width="20" height="20" rx="5" fill="none" stroke="#2F6F68" stroke-width="3"/>
    <circle cx="0" cy="0" r="3.5" fill="#2F6F68"/>
  </g>

  <!-- small floating dots for softness -->
  <circle cx="105" cy="200" r="5" fill="#C99A5A" opacity="0.7"/>
  <circle cx="520" cy="180" r="4" fill="#3E8079" opacity="0.7"/>
  <circle cx="90" cy="340" r="3.5" fill="#4F5A76" opacity="0.7"/>
  <circle cx="545" cy="330" r="5" fill="#B0812E" opacity="0.6"/>
</svg>
